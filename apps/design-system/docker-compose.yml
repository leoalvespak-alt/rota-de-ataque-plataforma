services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: rota_design
      POSTGRES_USER: rota_design
      POSTGRES_PASSWORD: ${DESIGN_POSTGRES_PASSWORD:?DESIGN_POSTGRES_PASSWORD is required}
    ports: ['127.0.0.1:5435:5432']
    volumes: [design_postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rota_design -d rota_design']
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['127.0.0.1:6382:6379']
    volumes: [design_redis_data:/data]
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    image: ${DESIGN_API_IMAGE:-rota-design-api:local}
    build:
      context: ../..
      dockerfile: apps/design-system/Dockerfile.api
    environment:
      DATABASE_URL: postgresql://rota_design:${DESIGN_POSTGRES_PASSWORD}@postgres:5432/rota_design
      DESIGN_MIGRATION_BASELINE_EXISTING: ${DESIGN_MIGRATION_BASELINE_EXISTING:-false}
    command: ['pnpm', 'db:migrate']
    depends_on:
      postgres: { condition: service_healthy }
    restart: 'no'

  api:
    image: ${DESIGN_API_IMAGE:-rota-design-api:local}
    build:
      context: ../..
      dockerfile: apps/design-system/Dockerfile.api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://rota_design:${DESIGN_POSTGRES_PASSWORD}@postgres:5432/rota_design
      REDIS_URL: redis://redis:6379
      API_PORT: '3001'
      WEB_ORIGIN: ${DESIGN_WEB_ORIGIN:-http://localhost:5173}
      API_SESSION_SECRET: ${DESIGN_API_SESSION_SECRET:?DESIGN_API_SESSION_SECRET is required}
      DESIGN_API_PASSWORD: ${DESIGN_API_PASSWORD:?DESIGN_API_PASSWORD is required}
      API_AUTH_TOKEN: ${DESIGN_API_AUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-4-20250514}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      FAL_API_KEY: ${FAL_API_KEY:-}
      RELEASE_ID: ${RELEASE_ID:-development}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      NODE_ENV: production
    ports: ['127.0.0.1:3002:3001']
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD', 'wget', '--spider', '-q', 'http://127.0.0.1:3001/health']
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  design_postgres_data:
  design_redis_data:
