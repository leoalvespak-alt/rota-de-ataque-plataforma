server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;

    # Assets com cache longo (Vite gera hashes no nome)
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico|webp|gif|ttf|otf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: qualquer rota que não seja arquivo serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
