name: CI/CD (Design System + Prospector)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

concurrency:
  group: production-design-prospector
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: prep
        run: |
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          OWNER=$(echo "${{ env.IMAGE_OWNER }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> $GITHUB_ENV

      - name: Build and push Design Web (Vite SPA)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/design-system/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-web:${{ steps.prep.outputs.tag }},${{ env.REGISTRY }}/${{ env.owner }}/rota-design-web:latest

      - name: Build and push Design API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/design-system/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-api:${{ steps.prep.outputs.tag }},${{ env.REGISTRY }}/${{ env.owner }}/rota-design-api:latest

      - name: Build and push Prospector Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-web:${{ steps.prep.outputs.tag }},${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-web:latest

      - name: Build and push Prospector Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/worker.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-worker:${{ steps.prep.outputs.tag }},${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-worker:latest

  deploy:
    needs: build-and-push
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Deploy to VPS
        env:
          SSH_KEY: ${{ secrets.SSH_DEPLOY_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=20 root@$VPS_HOST"

          $SSH "/opt/rota-deploy/deploy.sh design-prospector '${{ needs.build-and-push.outputs.tag }}'"
