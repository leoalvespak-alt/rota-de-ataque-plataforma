name: Dokploy CI/CD (Design System)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: prep
        run: |
          TAG=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          OWNER=$(echo "${{ env.IMAGE_OWNER }}" | tr '[:upper:]' '[:lower:]')
          echo "owner=$OWNER" >> $GITHUB_ENV

      - name: Build and push Design Web (Vite SPA)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/design-system/Dockerfile.web
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-web:${{ steps.prep.outputs.tag }},${{ env.REGISTRY }}/${{ env.owner }}/rota-design-web:latest

      - name: Build and push Design API
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/design-system/Dockerfile.api
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-api:${{ steps.prep.outputs.tag }},${{ env.REGISTRY }}/${{ env.owner }}/rota-design-api:latest

      - name: Build and push Prospector Web
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-web:${{ steps.prep.outputs.tag }},${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-web:latest

      - name: Build and push Prospector Worker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./docker/worker.Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-worker:${{ steps.prep.outputs.tag }},${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-worker:latest

      - name: Trigger Dokploy Webhooks
        run: |
          if [ -n "${{ secrets.DOKPLOY_WEBHOOK_URL }}" ]; then
            curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}"
            echo "Webhook triggered successfully"
          else
            echo "DOKPLOY_WEBHOOK_URL not set, skipping webhook"
          fi
