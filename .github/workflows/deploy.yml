name: Build e publica imagens (Design System + Prospector)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

concurrency:
  group: build-editorial-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: prep
        shell: bash
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          OWNER="$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=$OWNER" >> "$GITHUB_ENV"

      - name: Build and push Design Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/design-system/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-web:${{ steps.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-web:latest

      - name: Build and push Design API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/design-system/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-api:${{ steps.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-api:latest

      - name: Build and push Prospector Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-web:${{ steps.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-web:latest

      - name: Build and push Prospector migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/prospector-migrations.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-migrations:${{ steps.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-migrations:latest

      - name: Deployment summary
        run: |
          echo "Imagens publicadas com a tag ${{ steps.prep.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
          echo "No host de produção WSL2, execute:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "./deploy/deploy-editorial-production-local.sh ${{ steps.prep.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
