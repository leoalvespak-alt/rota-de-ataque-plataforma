name: Build e publica imagens (Design System + Prospector)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

concurrency:
  group: build-editorial-production
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.prep.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: prep
        shell: bash
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          OWNER="$(echo "${IMAGE_OWNER}" | tr '[:upper:]' '[:lower:]')"
          echo "owner=$OWNER" >> "$GITHUB_ENV"

      - name: Build and push Design Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/design-system/Dockerfile.web
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-web:${{ steps.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-web:latest

      - name: Build and push Design API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/design-system/Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-api:${{ steps.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.owner }}/rota-design-api:latest

      - name: Build and push Prospector Web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-web:${{ steps.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-web:latest

      - name: Build and push Prospector migrations
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/prospector-migrations.Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-migrations:${{ steps.prep.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.owner }}/prospector-platform-migrations:latest

      - name: Deployment summary
        run: |
          echo "Imagens publicadas com a tag ${{ steps.prep.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
          echo "No host de produção WSL2, execute:" >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "./deploy/deploy-editorial-production-local.sh ${{ steps.prep.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: Deploy no WSL2 de produção
    needs: build-and-push
    runs-on: [self-hosted, linux, x64]
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    env:
      ROTA_EDITORIAL_ENV_FILE: /mnt/c/Users/Lenovo/Desktop/Rota de Ataque/Sistema de Design/plataforma/docker/.env.phase7.local
      ROTA_EDITORIAL_PROJECT_NAME: rota-editorial-fase7
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate production host inputs
        shell: bash
        run: |
          test -f "$ROTA_EDITORIAL_ENV_FILE"
          docker version
          docker compose version

      - name: Pull, migrate and activate immutable release
        shell: bash
        run: |
          bash ./deploy/deploy-editorial-production-local.sh "${{ needs.build-and-push.outputs.tag }}"

      - name: Deployment summary
        run: |
          echo "Imagens publicadas e release ativado no host WSL2 com a tag ${{ needs.build-and-push.outputs.tag }}." >> "$GITHUB_STEP_SUMMARY"
