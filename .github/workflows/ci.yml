name: plataforma-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  design-system-no-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plataforma/design-system exec playwright install --with-deps chromium
      - run: pnpm --filter @plataforma/design-system exec vitest run --maxWorkers=1
      - run: pnpm --filter @plataforma/design-system exec playwright test --reporter=json --forbid-only > e2e.json
      - run: node scripts/fail-on-skipped.mjs e2e.json
      - run: pnpm --filter @plataforma/design-system build
      - run: pnpm --filter @plataforma/design-system lint
      - run: pnpm check:hashes

  workspace-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TURBO_CONCURRENCY: 4
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:runtime-deps
      - run: pnpm check:compose-runtime
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec turbo run test --filter=!@plataforma/design-system --concurrency=4
      - run: pnpm exec turbo run build --concurrency=4

  database-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: plataforma
          POSTGRES_DB: plataforma_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U plataforma -d plataforma_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres_sqlcheck:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: plataforma
          POSTGRES_PASSWORD: plataforma
          POSTGRES_DB: plataforma_sqlcheck
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U plataforma -d plataforma_sqlcheck"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://plataforma:plataforma@localhost:5432/plataforma_ci
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @plataforma/shared build
      - run: node scripts/check-sql-columns.mjs
        env:
          DATABASE_URL: postgresql://plataforma:plataforma@localhost:5433/plataforma_sqlcheck
      - run: pnpm --filter @plataforma/db migrate
      - run: pnpm --filter @plataforma/worker-meta-sync test:integration
      - run: pnpm --filter @plataforma/db migrate:down
      - run: pnpm --filter @plataforma/db migrate
