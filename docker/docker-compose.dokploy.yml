x-worker: &worker
  image: ${WORKER_IMAGE:-ghcr.io/leoalvespak-alt/prospector-platform-worker:latest}
  pull_policy: always
  restart: unless-stopped
  env_file: .env
  environment:
    DATABASE_POOL_MAX: "2"
    EXPECTED_DB_MIGRATION: "0035_reconcile_automation_runtime"
  entrypoint: ["/app/docker/worker-entrypoint.sh"]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    embeddings: { condition: service_healthy }

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "max_connections=200"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ["--model-id", "${EMBEDDINGS_MODEL}", "--port", "8080"]
    restart: unless-stopped
    volumes:
      - embeddings_cache:/data
    deploy:
      resources:
        limits:
          cpus: "1.25"
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/info"]
      interval: 30s
      timeout: 10s
      retries: 10

  web:
    image: ghcr.io/leoalvespak-alt/prospector-platform-web:latest
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_POOL_MAX: "10"
      EXPECTED_DB_MIGRATION: "0035_reconcile_automation_runtime"
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      embeddings: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/prospector/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 10

  migrate:
    image: ghcr.io/leoalvespak-alt/prospector-platform-worker:latest
    pull_policy: always
    restart: "no"
    profiles: ["tools"]
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
    command: ["pnpm", "--filter", "@plataforma/db", "migrate"]

  scheduler:
    image: ${WORKER_IMAGE:-ghcr.io/leoalvespak-alt/prospector-platform-worker:latest}
    pull_policy: always
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    command: ["pnpm", "--filter", "@plataforma/queue", "scheduler"]

  worker-discovery:
    <<: *worker
    command: ["pnpm", "--filter", "@plataforma/worker-discovery", "start"]
  worker-extraction:
