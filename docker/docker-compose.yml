name: plataforma-rota

x-worker: &worker
  image: ${WORKER_IMAGE:-prospector-platform-worker:latest}
  build:
    context: ..
    dockerfile: docker/worker.Dockerfile
  environment:
    DATABASE_POOL_MAX: "2"
  restart: unless-stopped
  entrypoint: ["/app/docker/worker-entrypoint.sh"]
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
    embeddings: { condition: service_healthy }
  volumes:
    - chromium_profiles:/data/chromium_profiles
    - snapshots_tmp:/data/snapshots_tmp

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: ["postgres", "-c", "max_connections=200"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "900", "1", "--save", "300", "10"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    command: ["--model-id", "${EMBEDDINGS_MODEL}", "--port", "8080"]
    volumes:
      - embeddings_cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/info"]
      interval: 30s
      timeout: 10s
      retries: 10

  web:
    image: ${WEB_IMAGE:-prospector-platform-web:latest}
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
    environment:
      DATABASE_POOL_MAX: "10"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      embeddings: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000${NEXT_PUBLIC_BASE_PATH:-}/api/health"]
      interval: 30s
      timeout: 5s
      retries: 10

  migrate:
    image: ${WORKER_IMAGE:-prospector-platform-worker:latest}
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
    command: ["pnpm", "--filter", "@plataforma/db", "migrate"]
    restart: "no"
    profiles: ["tools"]

  scheduler:
    image: ${WORKER_IMAGE:-prospector-platform-worker:latest}
    build:
      context: ..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    command: ["pnpm", "--filter", "@plataforma/queue", "scheduler"]

  cron:
    build:
      context: ..
      dockerfile: docker/backup.Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    volumes:
      - chromium_profiles:/data/chromium_profiles:ro
    command: ["crond", "-f", "-l", "2"]

  caddy:
    image: caddy:2.9-alpine
    environment:
      APP_URL: ${APP_URL}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      web: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  worker-discovery:
    <<: *worker
    command: ["pnpm", "--filter", "@plataforma/worker-discovery", "start"]
  worker-extraction:
    <<: *worker
    command: ["pnpm", "--filter", "@plataforma/worker-extraction", "start"]
  worker-meta-sync:
    <<: *worker
    command: ["pnpm", "--filter", "@plataforma/worker-meta-sync", "start"]
  worker-meta-webhook-consumer:
    <<: *worker
    command: ["pnpm", "--filter", "@plataforma/worker-meta-webhook-consumer", "start"]
  worker-classification:
    <<: *worker
    command: ["pnpm", "--filter", "@plataforma/worker-classification", "start"]
  worker-scoring:
    <<: *worker
    command: ["pnpm", "--filter", "@plataforma/worker-scoring", "start"]
  worker-enrichment:
